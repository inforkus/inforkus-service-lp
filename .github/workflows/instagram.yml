name: Instagram の投稿を取得
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 9:00（日本時間）
  workflow_dispatch:
    inputs:
      refresh:
        description: 'トークンを今すぐ延ばす'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿を取得
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/fetch_instagram.py
      - name: 変わっていれば保存して公開し直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A instagram.json ig 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram の投稿を更新"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
      - name: トークンの残り日数を確かめる（残り7日以下で赤い ✕ にしてメールで知らせる）
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/ig_token.py check
      - name: トークンを延ばす（月曜か手動のときだけ。3つの Secret を登録したときだけ）
        if: ${{ always() && (github.event_name == 'schedule' || inputs.refresh) }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ github.event.inputs.refresh }}" != "true" ] && [ "$(date -u +%u)" != 1 ]; then echo "月曜ではないため省略"; exit 0; fi
          python3 scripts/ig_token.py refresh
